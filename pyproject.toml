[project]
name = "tto-testgen"
version = "0.1.0"
description = "TTO Test Analyst Agent System - deterministic toolchain exposed as an MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.1",
    "pydantic==2.13.5",
    "jinja2==3.1.6",
    # U2: safe parsing of the Figma manifest and any OpenAPI spec. A direct
    # dependency, not transitive - the MCP SDK does not pull it in.
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-benchmark==5.1.0",
    "hypothesis==6.123.2",
    "import-linter==2.1",
    # NFR-SEC-09: pip-audit covers both vulnerability scanning and CycloneDX SBOM
    # emission (--format cyclonedx-json). cyclonedx-bom was dropped: it pins
    # cyclonedx-python-lib>=8 while pip-audit pins <8, and carrying two tools for
    # one job would violate the no-unused-dependencies rule anyway.
    "pip-audit==2.7.3",
]

[project.scripts]
tto-testgen-mcp = "tto_testgen.composition:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tto_testgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "benchmark: performance budget assertions, run on demand",
]

[tool.hypothesis]
# PBT-08: failing seeds are reported so a counterexample can be replayed deterministically.
print_blob = true
